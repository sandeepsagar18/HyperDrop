name: hyperdrop_mobile
description: HyperDrop - Cross-Platform High-Speed Local LAN, Zero-Network Hotspot & Remote WebRTC File Transfer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.10.6
  web_socket_channel: ^3.0.1
  network_info_plus: ^5.0.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  dio: ^5.4.1
  http: ^1.2.1
  crypto: ^3.0.3
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1
  permission_handler: ^11.3.1
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
