publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: ^2.5.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  network_info_plus: ^5.0.1
  dio: ^5.4.1
  http: ^1.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
